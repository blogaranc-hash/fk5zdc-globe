      50% {

      }

      // Active coastline polygons: starts with high-detail fallback and upgrades seamlessly with 50m TopoJSON
      let activeLandPolygons = FALLBACK_LAND_POLYGONS.map((ring) => ({
        coords: ring,
        isNewCaledonia: false,
        areaHint: 1
      }));

      function classifyPolygon(ring) {
        let minLon = Infinity;
        let maxLon = -Infinity;
        let minLat = Infinity;
        let maxLat = -Infinity;
        for (let i = 0; i < ring.length; i++) {
          const [lon, lat] = ring[i];
          if (lon < minLon) minLon = lon;
          if (lon > maxLon) maxLon = lon;
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
        }
        const isNC =
          minLon >= 162.8 &&
          maxLon <= 168.6 &&
          minLat >= -23.2 &&
          maxLat <= -19.3;
        const span = Math.max(0.05, (maxLon - minLon) * (maxLat - minLat));
        return {
          coords: ring,
          isNewCaledonia: isNC,
          areaHint: span
        };
      }

      function extractRingsFromGeoJson(geojson) {
        const rings = [];
        const walkGeometry = (geom) => {
          if (!geom) return;
          if (geom.type === 'Polygon') {
            if (Array.isArray(geom.coordinates) && geom.coordinates.length > 0) {
              rings.push(classifyPolygon(geom.coordinates[0]));
            }
          } else if (geom.type === 'MultiPolygon') {
            if (Array.isArray(geom.coordinates)) {
              for (const polyCoords of geom.coordinates) {
                if (Array.isArray(polyCoords) && polyCoords.length > 0) {
                  rings.push(classifyPolygon(polyCoords[0]));
                }
              }
            }
          } else if (geom.type === 'GeometryCollection' && Array.isArray(geom.geometries)) {
            for (const sub of geom.geometries) walkGeometry(sub);
          }
        };

        if (geojson.type === 'FeatureCollection' && Array.isArray(geojson.features)) {
          for (const feat of geojson.features) walkGeometry(feat.geometry);
        } else if (geojson.type === 'Feature') {
          walkGeometry(geojson.geometry);
        } else {
          walkGeometry(geojson);
        }
        return rings;
      }

      /**
       * Loads high-resolution 50m coastline polygons from World Atlas TopoJSON via CDN,
       * while keeping the immediate high-precision fallback polygons active offline or on error.
       */
      async function upgradeCoastlineResolution() {
        if (!window.topojson || typeof window.topojson.feature !== 'function') {
          return;
        }
        const sources = [
          'https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json',
          'https://unpkg.com/world-atlas@2/land-50m.json'
        ];

        for (const url of sources) {
          try {
            const resp = await fetch(url, { mode: 'cors' });
            if (!resp.ok) continue;
            const topo = await resp.json();
            const objKey = topo.objects && (topo.objects.land || topo.objects.countries);
            if (!objKey) continue;

            const geojson = window.topojson.feature(topo, objKey);
            const highResRings = extractRingsFromGeoJson(geojson);
            if (highResRings.length > 20) {
              // Merge high-res global/regional coastlines with custom New Caledonia/Loyalty detail rings
              const customNCRings = FALLBACK_LAND_POLYGONS.slice(0, 6).map((ring) => ({
                coords: ring,
                isNewCaledonia: true,
                areaHint: 0.4
              }));
              activeLandPolygons = [...highResRings, ...customNCRings];
              showToast('Cartographie HD 50m chargée · Trait de côte affiné');
              return;
            }
          } catch (_) {
            // Keep high-detail fallback dataset silently on network restriction
          }
        }
      }

      // =========================================================================
      // 2. DOM ELEMENTS & STATE
      // =========================================================================
      const canvas = document.getElementById('globe-canvas');
      const ctx = canvas.getContext('2d');
      const wrapper = document.getElementById('globe-wrapper');
      const toggleBtn = document.getElementById('toggle-card-btn');
      const toggleSpotsBtn = document.getElementById('toggle-spots-btn');
      const toggleLabel = document.getElementById('toggle-label');
      const infoCard = document.getElementById('beacon-info-card');
      const spotsCard = document.getElementById('reception-spots-card');
      const centerBtn = document.getElementById('center-beacon-btn');
      const zoomInBtn = document.getElementById('zoom-in-btn');
      const zoomOutBtn = document.getElementById('zoom-out-btn');
      const toastEl = document.getElementById('status-toast');
      const spotsListEl = document.getElementById('reception-spots-list');
      const spotsListMobileEl = document.querySelector('.reception-spots-list-mobile');
      const spotsCountEl = document.getElementById('spots-count');
      const topSpotsCountEl = document.getElementById('top-spots-count');
      const spotsCountMirrors = document.querySelectorAll('.spots-count-mirror');
      const toggleArcsBtns = document.querySelectorAll('.toggle-arcs-action');
      const clearSpotFocusBtns = document.querySelectorAll('.clear-spot-focus-action');
      const DEG2RAD = Math.PI / 180;

      function getTargetAnglesForBeacon(latDeg, lonDeg) {
        return {
          rotY: -(lonDeg + 90) * DEG2RAD,
          rotX: latDeg * DEG2RAD
        };
      }

      const initialTarget = getTargetAnglesForBeacon(BEACON.lat, BEACON.lon);

      const state = {
        width: 0,
        height: 0,
        dpr: Math.min(window.devicePixelRatio || 1, 2),

        // Current & target spherical rotation (radians)
        rotY: initialTarget.rotY,
        rotX: initialTarget.rotX,
        targetRotY: initialTarget.rotY,
        targetRotX: initialTarget.rotX,
        isRecentering: false,

        // Angular velocity for smooth inertia after dragging
        velY: 0,
        velX: 0,

        // Zoom factor (1.0 = default fit, > 1 = zoomed in, < 1 = zoomed out)
        zoom: 1.08,
        targetZoom: 1.08,
        minZoom: 0.68,
        maxZoom: 3.4,

        // Subtle pointer parallax offset (normalized -1..1)
        pointerNormX: 0,
        pointerNormY: 0,
        smoothPointerX: 0,
        smoothPointerY: 0,

        // Drag & touch tracking
        isDragging: false,
        lastPointerX: 0,
        lastPointerY: 0,
        pinchStartDist: null,
        pinchStartZoom: 1,

        // Subtle idle oscillation when not dragging (keeps globe lively while staying anchored near Mont Do)
        autoDrift: true,
        time: 0,

        // Great-circle reception arcs state
        showArcs: true,
        selectedSpotId: null
      };

      function renderSpotsListUI() {
        if (!spotsListEl || !spotsCountEl) return;
        spotsCountEl.textContent = String(RECEPTION_SPOTS.length);
        spotsListEl.innerHTML = '';

        for (const spot of RECEPTION_SPOTS) {
          const isSelected = state.selectedSpotId === spot.id;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `spot-chip text-[11px] px-2 py-1 rounded-lg border font-medium flex items-center gap-1 ${
            isSelected
              ? 'bg-emerald-500/25 border-emerald-400 text-emerald-200'
              : 'bg-slate-800/75 border-slate-700/80 text-slate-200 hover:border-sky-400/50 hover:text-sky-200'
          }`;
          btn.title = `${spot.name} (${spot.category}) — ${spot.note}`;
          btn.innerHTML = `
            <span class="h-1.5 w-1.5 rounded-full ${spot.category === 'État US' ? 'bg-sky-400' : 'bg-emerald-400'}"></span>
            <span>${spot.name}</span>
          `;

          btn.addEventListener('click', () => {
            if (state.selectedSpotId === spot.id) {
              state.selectedSpotId = null;
              clearSpotFocusBtns.forEach((b) => b.classList.add('hidden'));
              renderSpotsListUI();
              showToast('Affichage de tous les arcs de réception');
              return;
            }
            state.selectedSpotId = spot.id;
            clearSpotFocusBtns.forEach((b) => b.classList.remove('hidden'));
            renderSpotsListUI();
            const target = getTargetAnglesForBeacon(spot.lat, spot.lon);
            state.targetRotY = target.rotY;
            state.targetRotX = target.rotX;
            state.isRecentering = true;
            state.velY = 0;
            state.velX = 0;
            showToast(`Arc sélectionné : ${spot.name} (${spot.note})`);
          });

          spotsListEl.appendChild(btn);
        }
      }

      // =========================================================================
      // 3. STARFIELD, PROJECTION & GEOMETRY HELPERS
      // =========================================================================
      const stars = Array.from({ length: 160 }, (_, idx) => ({
        xRatio: ((idx * 73) % 1000) / 1000,
        yRatio: ((idx * 197) % 1000) / 1000,
        size: (idx % 3 === 0 ? 1.5 : idx % 2 === 0 ? 1.05 : 0.7),
        baseAlpha: 0.25 + ((idx * 37) % 65) / 100,
        twinkleSpeed: 0.001 + ((idx * 19) % 25) * 0.0001,
        phase: idx * 0.85
      }));

      let toastTimer = null;
      function showToast(message) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.classList.remove('opacity-0', 'translate-y-2');
        toastEl.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('opacity-100', 'translate-y-0');
          toastEl.classList.add('opacity-0', 'translate-y-2');
        }, 2600);
      }

      function resizeCanvas() {
        const rect = wrapper.getBoundingClientRect();
        state.width = Math.max(1, Math.floor(rect.width));
        state.height = Math.max(1, Math.floor(rect.height));
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function getGlobeRadius() {
        const minDim = Math.min(state.width, state.height);
        return Math.max(70, minDim * 0.36) * state.zoom;
      }

      function getGlobeCenter() {
        const isWide = state.width >= 1024;
        // Center the globe fully in the viewport without shifting away from any card
        const offsetX = 0;
        const offsetY = isWide ? state.height * 0.01 : 0;
        return {
          cx: state.width * 0.5 + offsetX - state.smoothPointerX * 14,
          cy: state.height * 0.5 + offsetY - state.smoothPointerY * 14
        };
      }

      function projectLatLon(latDeg, lonDeg, radius, center, altMult = 1) {
        const unit = latLonToVec3(latDeg, lonDeg);
        return projectUnitVec3(unit.x, unit.y, unit.z, radius, center, altMult);
      }

      function drawStars(time) {
        ctx.save();
        const parallaxX = -state.smoothPointerX * 10;
        const parallaxY = -state.smoothPointerY * 10;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = 0.65 + 0.35 * Math.sin(time * s.twinkleSpeed + s.phase);
          const alpha = Math.max(0.05, Math.min(1, s.baseAlpha * twinkle));
          const sx = s.xRatio * state.width + parallaxX * (0.4 + s.size * 0.25);
          const sy = s.yRatio * state.height + parallaxY * (0.4 + s.size * 0.25);

          ctx.beginPath();
          ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(224, 242, 254, ${alpha.toFixed(3)})`;
          ctx.fill();
        }
        ctx.restore();
      }

      // =========================================================================
      // 4. GLOBE, CARTOGRAPHY, GREAT-CIRCLE ARCS & BEACON RENDERERS
      // =========================================================================
      function drawAtmosphereAndSphere(radius, center) {
        // Brighter outer atmospheric halo for a luminous blog aesthetic
        const outerGlow = ctx.createRadialGradient(
          center.cx - radius * 0.28,
          center.cy - radius * 0.28,
          radius * 0.86,
          center.cx,
          center.cy,
          radius * 1.28
        );
        outerGlow.addColorStop(0, 'rgba(125, 211, 252, 0.36)');
        outerGlow.addColorStop(0.45, 'rgba(56, 189, 248, 0.18)');
        outerGlow.addColorStop(0.75, 'rgba(52, 211, 153, 0.09)');
        outerGlow.addColorStop(1, 'rgba(8, 17, 30, 0)');

        ctx.save();
        ctx.beginPath();
        ctx.arc(center.cx, center.cy, radius * 1.28, 0, Math.PI * 2);
        ctx.fillStyle = outerGlow;
        ctx.fill();

        // Clip inside Earth sphere for ocean, graticule, continents, and directional lighting
        ctx.beginPath();
        ctx.arc(center.cx, center.cy, radius, 0, Math.PI * 2);
        ctx.clip();

        // Luminous ocean gradient with strong directional key light from upper-left
        const oceanGrad = ctx.createRadialGradient(
          center.cx - radius * 0.38,
          center.cy - radius * 0.36,
          radius * 0.06,
          center.cx + radius * 0.1,
          center.cy + radius * 0.12,
          radius * 1.14
        );
        oceanGrad.addColorStop(0, '#3b82f6');
        oceanGrad.addColorStop(0.35, '#1d5fa3');
        oceanGrad.addColorStop(0.72, '#143c6b');
        oceanGrad.addColorStop(1, '#0c2342');

        ctx.fillStyle = oceanGrad;
        ctx.fillRect(center.cx - radius - 4, center.cy - radius - 4, radius * 2 + 8, radius * 2 + 8);

        // Soft directional daylight highlight sweep on upper-left hemisphere
        const keyLightGrad = ctx.createRadialGradient(
          center.cx - radius * 0.45,
          center.cy - radius * 0.42,
          radius * 0.02,
          center.cx - radius * 0.22,
          center.cy - radius * 0.2,
          radius * 0.92
        );
        keyLightGrad.addColorStop(0, 'rgba(186, 230, 253, 0.28)');
        keyLightGrad.addColorStop(0.55, 'rgba(125, 211, 252, 0.09)');
        keyLightGrad.addColorStop(1, 'rgba(125, 211, 252, 0)');
        ctx.fillStyle = keyLightGrad;
        ctx.fillRect(center.cx - radius - 4, center.cy - radius - 4, radius * 2 + 8, radius * 2 + 8);

        // Draw graticule (parallels & meridians)
        drawGraticule(radius, center);

        // Draw continents & New Caledonia archipelago
        drawContinents(radius, center);

        // Draw hypsometric relief ridges, rivers & Maidenhead locator grid
        drawCartographicDetails(radius, center);

        // Balanced spherical shading: bright lit hemisphere, gentle limb falloff so dark side stays legible
        const rimGrad = ctx.createRadialGradient(
          center.cx - radius * 0.34,
          center.cy - radius * 0.34,
          radius * 0.48,
          center.cx,
          center.cy,
          radius
        );
        rimGrad.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
        rimGrad.addColorStop(0.74, 'rgba(15, 35, 66, 0.08)');
        rimGrad.addColorStop(1, 'rgba(5, 14, 28, 0.46)');
        ctx.fillStyle = rimGrad;
        ctx.fillRect(center.cx - radius - 4, center.cy - radius - 4, radius * 2 + 8, radius * 2 + 8);

        ctx.restore();

        // Crisp luminous rim stroke
        ctx.beginPath();
        ctx.arc(center.cx, center.cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.52)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      function drawGraticule(radius, center) {
        ctx.save();

        // Fine 15° graticule grid + emphasized 30° & Equator/Prime/165°E reference lines
        for (let lat = -75; lat <= 75; lat += 15) {
          const isMajor = lat % 30 === 0;
          const isEquator = lat === 0;
          ctx.beginPath();
          let started = false;
          for (let lon = -180; lon <= 180; lon += 3) {
            const p = projectLatLon(lat, lon, radius, center);
            if (p.z >= 0) {
              if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
              } else {
                ctx.lineTo(p.x, p.y);
              }
            } else {
              started = false;
            }
          }
          ctx.lineWidth = isEquator ? 1.15 : isMajor ? 0.85 : 0.55;
          ctx.strokeStyle = isEquator
            ? 'rgba(224, 242, 254, 0.42)'
            : isMajor
              ? 'rgba(186, 230, 253, 0.22)'
              : 'rgba(186, 230, 253, 0.10)';
          ctx.stroke();
        }

        // Meridians every 15 degrees (-180 to +165)
        for (let lon = -180; lon < 180; lon += 15) {
          const isMajor = lon % 30 === 0;
          const isRegional = lon === 165 || lon === 180;
          ctx.beginPath();
          let started = false;
          for (let lat = -84; lat <= 84; lat += 3) {
            const p = projectLatLon(lat, lon, radius, center);
            if (p.z >= 0) {
              if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
              } else {
                ctx.lineTo(p.x, p.y);
              }
            } else {
              started = false;
            }
          }
          ctx.lineWidth = isRegional ? 1.0 : isMajor ? 0.85 : 0.55;
          ctx.strokeStyle = isRegional
            ? 'rgba(110, 231, 183, 0.26)'
            : isMajor
              ? 'rgba(186, 230, 253, 0.22)'
              : 'rgba(186, 230, 253, 0.10)';
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawContinents(radius, center) {
        ctx.save();

        // Multi-scale stroke weight that stays sharp when zooming into Mont Do / Nouvelle-Calédonie
        const zoomScale = Math.sqrt(Math.max(0.6, state.zoom));

        for (let i = 0; i < activeLandPolygons.length; i++) {
          const item = activeLandPolygons[i];
          const poly = item.coords;
          if (!poly || poly.length < 3) continue;

          const isNewCaledonia = Boolean(item.isNewCaledonia);
          const isSmallFeature = (item.areaHint || 1) < 1.2;

          // Subdivide long edges so spherical curvature and coastlines stay smooth at all zoom levels
          const stepsPerEdge = isNewCaledonia ? 8 : isSmallFeature ? 4 : 2;
          const pts = [];
          for (let j = 0; j < poly.length; j++) {
            const [lon1, lat1] = poly[j];
            const [lon2, lat2] = poly[(j + 1) % poly.length];
            // Skip antimeridian wrap jumps on global polygons
            if (Math.abs(lon2 - lon1) > 180) {
              pts.push(projectLatLon(lat1, lon1, radius, center));
              continue;
            }
            for (let s = 0; s < stepsPerEdge; s++) {
              const t = s / stepsPerEdge;
              const lat = lat1 + (lat2 - lat1) * t;
              const lon = lon1 + (lon2 - lon1) * t;
              pts.push(projectLatLon(lat, lon, radius, center));
            }
          }

          // Check if any vertex is on the front hemisphere
          const hasFrontVertex = pts.some((pt) => pt.z > -radius * 0.14);
          if (!hasFrontVertex) continue;

          ctx.beginPath();
          let moved = false;
          for (let k = 0; k < pts.length; k++) {
            const pt = pts[k];
            if (!moved) {
              ctx.moveTo(pt.x, pt.y);
              moved = true;
            } else {
              ctx.lineTo(pt.x, pt.y);
            }
          }
          ctx.closePath();

          // Hypsometric-inspired coastal & landmass tinting with luminous balance
          ctx.fillStyle = isNewCaledonia
            ? 'rgba(110, 231, 183, 0.74)'
            : 'rgba(134, 219, 196, 0.62)';
          ctx.fill();

          // 1. Subtle coastal bathymetric / shelf glow behind the shoreline
          ctx.save();
          ctx.strokeStyle = isNewCaledonia
            ? 'rgba(52, 211, 153, 0.34)'
            : 'rgba(125, 211, 252, 0.20)';
          ctx.lineWidth = (isNewCaledonia ? 5.2 : 3.2) * zoomScale;
          ctx.stroke();
          ctx.restore();

          // 2. Crisp, anti-aliased primary coastline stroke
          ctx.strokeStyle = isNewCaledonia
            ? 'rgba(236, 253, 245, 0.99)'
            : 'rgba(224, 247, 240, 0.88)';
          ctx.lineWidth = (isNewCaledonia ? 2.15 : 1.2) * zoomScale;
          ctx.stroke();
        }

        ctx.restore();
      }

      /**
       * Renders relief mountain ridges, hydrographic lines, and Maidenhead grid cells
       * (field RG38 and square RG38AF around Boulouparis / Mont Do).
       */
      function drawCartographicDetails(radius, center) {
        ctx.save();

        // 1. Mountain relief ridges (hypsometric elevation accents)
        for (let r = 0; r < RELIEF_RIDGES.length; r++) {
          const ridge = RELIEF_RIDGES[r];
          const isNCRidge = r === 0;
          ctx.beginPath();
          let started = false;
          for (let i = 0; i < ridge.length - 1; i++) {
            const [lon1, lat1] = ridge[i];
            const [lon2, lat2] = ridge[i + 1];
            const steps = isNCRidge ? 8 : 5;
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const p = projectLatLon(
                lat1 + (lat2 - lat1) * t,
                lon1 + (lon2 - lon1) * t,
                radius,
                center,
                1.0025
              );
              if (p.z >= 0) {
                if (!started) {
                  ctx.moveTo(p.x, p.y);
                  started = true;
                } else {
                  ctx.lineTo(p.x, p.y);
                }
              } else {
                started = false;
              }
            }
          }
          ctx.strokeStyle = isNCRidge
            ? 'rgba(253, 230, 138, 0.72)'
            : 'rgba(254, 240, 138, 0.42)';
          ctx.lineWidth = isNCRidge ? 1.85 : 1.15;
          ctx.setLineDash(isNCRidge ? [] : [3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 2. Hydrographic river lines
        for (let h = 0; h < HYDRO_RIVERS.length; h++) {
          const river = HYDRO_RIVERS[h];
          const isLocal = h === 1;
          ctx.beginPath();
          let started = false;
          for (let i = 0; i < river.length - 1; i++) {
            const [lon1, lat1] = river[i];
            const [lon2, lat2] = river[i + 1];
            for (let s = 0; s <= 5; s++) {
              const t = s / 5;
              const p = projectLatLon(
                lat1 + (lat2 - lat1) * t,
                lon1 + (lon2 - lon1) * t,
                radius,
                center,
                1.0012
              );
              if (p.z >= 0) {
                if (!started) {
                  ctx.moveTo(p.x, p.y);
                  started = true;
                } else {
                  ctx.lineTo(p.x, p.y);
                }
              } else {
                started = false;
              }
            }
          }
          ctx.strokeStyle = isLocal
            ? 'rgba(125, 211, 252, 0.75)'
            : 'rgba(147, 197, 253, 0.48)';
          ctx.lineWidth = isLocal ? 1.3 : 0.95;
          ctx.stroke();
        }

        // 3. Maidenhead Field RG38 (20° lon x 10° lat: 160°E..180°E, -30°S..-20°S)
        const fieldCorners = [
          projectLatLon(-20.0, 160.0, radius, center, 1.001),
          projectLatLon(-20.0, 180.0, radius, center, 1.001),
          projectLatLon(-30.0, 180.0, radius, center, 1.001),
          projectLatLon(-30.0, 160.0, radius, center, 1.001)
        ];
        if (fieldCorners.every((c) => c.z > 0)) {
          ctx.beginPath();
          ctx.moveTo(fieldCorners[0].x, fieldCorners[0].y);
          for (let c = 1; c < fieldCorners.length; c++) {
            ctx.lineTo(fieldCorners[c].x, fieldCorners[c].y);
          }
          ctx.closePath();
          ctx.strokeStyle = 'rgba(110, 231, 183, 0.25)';
          ctx.lineWidth = 0.9;
          ctx.setLineDash([5, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 4. Maidenhead Square RG38AF (2° lon x 1° lat: 166°E..168°E, -22°S..-21°S)
        if (state.zoom >= 1.05) {
          const cellCorners = [
            projectLatLon(-21.0, 166.0, radius, center, 1.0018),
            projectLatLon(-21.0, 168.0, radius, center, 1.0018),
            projectLatLon(-22.0, 168.0, radius, center, 1.0018),
            projectLatLon(-22.0, 166.0, radius, center, 1.0018)
          ];
          if (cellCorners.every((c) => c.z > 0)) {
            ctx.beginPath();
            ctx.moveTo(cellCorners[0].x, cellCorners[0].y);
            for (let c = 1; c < cellCorners.length; c++) {
              ctx.lineTo(cellCorners[c].x, cellCorners[c].y);
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(110, 231, 183, 0.58)';
            ctx.lineWidth = 1.15;
            ctx.setLineDash([4, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Locator square tag inside RG38AF when zoomed in
            if (state.zoom >= 1.25) {
              const tagPos = projectLatLon(-21.18, 166.12, radius, center, 1.002);
              if (tagPos.z > 0) {
                ctx.font = '600 9.5px "JetBrains Mono", monospace';
                ctx.fillStyle = 'rgba(167, 243, 208, 0.85)';
                ctx.fillText('LOCATOR RG38AF', tagPos.x, tagPos.y);
              }
            }
          }
        }

        ctx.restore();
      }

      /**
       * Computes a 3D spherical surface ring around (latDeg, lonDeg) with angular radius `angularRadiusDeg`
       * and draws only the visible front-facing segments for crisp radio-wave propagation rings.
       */
      function drawSphericalWaveRing(latDeg, lonDeg, angularRadiusDeg, radius, center, strokeStyle, lineWidth) {
        const centerVec = latLonToVec3(latDeg, lonDeg);
        const upRef = Math.abs(centerVec.y) < 0.9 ? { x: 0, y: 1, z: 0 } : { x: 1, y: 0, z: 0 };

        // Tangent basis vectors u, v perpendicular to centerVec
        const u = normalizeVec3(crossVec3(upRef, centerVec));
        const v = crossVec3(centerVec, u);

        const cosAng = Math.cos(angularRadiusDeg * DEG2RAD);
        const sinAng = Math.sin(angularRadiusDeg * DEG2RAD);

        const segments = 64;
        ctx.save();
        ctx.beginPath();
        let drawing = false;

        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          // Point on unit sphere at angular distance `angularRadiusDeg` from beacon
          const px = centerVec.x * cosAng + (u.x * cosT + v.x * sinT) * sinAng;
          const py = centerVec.y * cosAng + (u.y * cosT + v.y * sinT) * sinAng;
          const pz = centerVec.z * cosAng + (u.z * cosT + v.z * sinT) * sinAng;

          const proj = projectUnitVec3(px, py, pz, radius, center, 1.004);
          if (proj.z >= 0) {
            if (!drawing) {
              ctx.moveTo(proj.x, proj.y);
              drawing = true;
            } else {
              ctx.lineTo(proj.x, proj.y);
            }
          } else {
            drawing = false;
          }
        }

        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
        ctx.restore();
      }

      function latLonToVec3(latDeg, lonDeg) {
        const lat = latDeg * DEG2RAD;
        const lon = lonDeg * DEG2RAD;
        const cosLat = Math.cos(lat);
        return {
          x: cosLat * Math.sin(lon),
          y: -Math.sin(lat),
          z: cosLat * Math.cos(lon)
        };
      }

      function crossVec3(a, b) {
        return {
          x: a.y * b.z - a.z * b.y,
          y: a.z * b.x - a.x * b.z,
          z: a.x * b.y - a.y * b.x
        };
      }

      function normalizeVec3(v) {
        const len = Math.hypot(v.x, v.y, v.z) || 1;
        return { x: v.x / len, y: v.y / len, z: v.z / len };
      }

      /**
       * Spherical linear interpolation (SLERP) along the great circle between two unit vectors,
       * elevated slightly above the globe surface (`altBoost`) to suggest ionospheric / skywave arc.
       */
      function drawGreatCircleArc(fromLat, fromLon, toLat, toLon, radius, center, time, options = {}) {
        const v0 = normalizeVec3(latLonToVec3(fromLat, fromLon));
        const v1 = normalizeVec3(latLonToVec3(toLat, toLon));

        const dot = Math.max(-1, Math.min(1, v0.x * v1.x + v0.y * v1.y + v0.z * v1.z));
        const omega = Math.acos(dot);
        if (omega < 0.0001) return;

        const sinOmega = Math.sin(omega);
        const steps = 72;
        const maxLift = options.maxLift ?? 0.14;
        const isHighlighted = Boolean(options.highlighted);
        const isDimmed = Boolean(options.dimmed);
        const isUS = Boolean(options.isUS);
        const isEurope = Boolean(options.isEurope);

        const points = [];
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const w0 = Math.sin((1 - t) * omega) / sinOmega;
          const w1 = Math.sin(t * omega) / sinOmega;

          const ux = v0.x * w0 + v1.x * w1;
          const uy = v0.y * w0 + v1.y * w1;
          const uz = v0.z * w0 + v1.z * w1;

          // Parabolic elevation peak at t = 0.5 so the arc rises gracefully above the surface
          const arcLift = 1 + Math.sin(t * Math.PI) * maxLift;
          const proj = projectUnitVec3(ux, uy, uz, radius, center, arcLift);
          points.push({ ...proj, t });
        }

        ctx.save();
        ctx.beginPath();
        let drawing = false;
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (p.z >= -radius * 0.05) {
            if (!drawing) {
              ctx.moveTo(p.x, p.y);
              drawing = true;
            } else {
              ctx.lineTo(p.x, p.y);
            }
          } else {
            drawing = false;
          }
        }

        if (isHighlighted) {
          ctx.strokeStyle = isUS
            ? 'rgba(209, 250, 229, 1)'
            : isEurope
              ? 'rgba(255, 237, 213, 1)'
              : 'rgba(255, 253, 210, 1)';
          ctx.lineWidth = 3.4;
          ctx.shadowColor = isUS
            ? 'rgba(52, 211, 153, 0.98)'
            : isEurope
              ? 'rgba(251, 146, 60, 0.98)'
              : 'rgba(250, 204, 21, 0.98)';
          ctx.shadowBlur = 14;
        } else if (isDimmed) {
          ctx.strokeStyle = isUS
            ? 'rgba(52, 211, 153, 0.36)'
            : isEurope
              ? 'rgba(251, 146, 60, 0.38)'
              : 'rgba(253, 224, 71, 0.36)';
          ctx.lineWidth = 1.4;
          ctx.shadowBlur = 0;
        } else if (isUS) {
          ctx.strokeStyle = 'rgba(110, 231, 183, 0.96)';
          ctx.lineWidth = 2.15;
          ctx.shadowColor = 'rgba(16, 185, 129, 0.82)';
          ctx.shadowBlur = 10;
        } else if (isEurope) {
          ctx.strokeStyle = 'rgba(253, 186, 116, 0.98)';
          ctx.lineWidth = 2.2;
          ctx.shadowColor = 'rgba(249, 115, 22, 0.86)';
          ctx.shadowBlur = 11;
        } else {
          ctx.strokeStyle = 'rgba(254, 240, 138, 0.96)';
          ctx.lineWidth = 2.15;
          ctx.shadowColor = 'rgba(250, 204, 21, 0.78)';
          ctx.shadowBlur = 10;
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Animated signal pulse traveling along the arc from FK5ZDC to the listener
        if (!isDimmed) {
          const pulseT = ((time * 0.00038) + (options.phaseOffset || 0)) % 1;
          const pulseIdx = Math.min(points.length - 1, Math.floor(pulseT * points.length));
          const pulsePt = points[pulseIdx];
          if (pulsePt && pulsePt.z > 4) {
            ctx.beginPath();
            ctx.arc(pulsePt.x, pulsePt.y, isHighlighted ? 5.4 : 3.8, 0, Math.PI * 2);
            ctx.fillStyle = isUS ? '#ecfdf5' : isEurope ? '#fff7ed' : '#fefce8';
            ctx.shadowColor = isUS ? '#34d399' : isEurope ? '#fb923c' : '#facc15';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        ctx.restore();
      }

      function drawReceptionArcsAndSpots(radius, center, time) {
        if (!state.showArcs) return;

        const placedLabelBoxes = [];
        // Sort visible spots so selected or closer-to-center points get label priority, while displaying all non-overlapping names
        const orderedIndices = RECEPTION_SPOTS.map((_, idx) => idx).sort((a, b) => {
          if (RECEPTION_SPOTS[a].id === state.selectedSpotId) return -1;
          if (RECEPTION_SPOTS[b].id === state.selectedSpotId) return 1;
          const pa = projectLatLon(RECEPTION_SPOTS[a].lat, RECEPTION_SPOTS[a].lon, radius, center, 1.004);
          const pb = projectLatLon(RECEPTION_SPOTS[b].lat, RECEPTION_SPOTS[b].lon, radius, center, 1.004);
          return pb.z - pa.z;
        });

        for (let k = 0; k < orderedIndices.length; k++) {
          const i = orderedIndices[k];
          const spot = RECEPTION_SPOTS[i];
          const isSelected = state.selectedSpotId === spot.id;
          const isDimmed = Boolean(state.selectedSpotId && !isSelected);

          drawGreatCircleArc(
            BEACON.lat,
            BEACON.lon,
            spot.lat,
            spot.lon,
            radius,
            center,
            time,
            {
              isUS: spot.category === 'État US',
              isEurope: Boolean(spot.isEurope),
              highlighted: isSelected,
              dimmed: isDimmed,
              phaseOffset: i * 0.14
            }
          );

          const targetProj = projectLatLon(spot.lat, spot.lon, radius, center, 1.004);
          if (targetProj.z > 0) {
            const fade = Math.max(0.45, Math.min(1, targetProj.z / (radius * 0.22)));
            const alpha = isDimmed ? 0.34 * fade : fade;
            const displayLabel = spot.regionLabel || spot.name;

            ctx.save();
            ctx.beginPath();
            ctx.arc(targetProj.x, targetProj.y, isSelected ? 5.0 : 3.5, 0, Math.PI * 2);
            ctx.fillStyle = isSelected
              ? `rgba(254, 240, 138, ${(0.98 * alpha).toFixed(3)})`
              : spot.category === 'État US'
                ? `rgba(56, 189, 248, ${(0.96 * alpha).toFixed(3)})`
                : spot.isEurope
                  ? `rgba(251, 146, 60, ${(0.98 * alpha).toFixed(3)})`
                  : `rgba(110, 231, 183, ${(0.96 * alpha).toFixed(3)})`;
            ctx.fill();

            if (alpha > 0.15) {
              const fontSize = isSelected
                ? 12.5
                : Math.max(10, Math.min(12.2, 10.4 * Math.sqrt(state.zoom)));
              ctx.font = isSelected
                ? `700 ${fontSize.toFixed(1)}px "JetBrains Mono", monospace`
                : `600 ${fontSize.toFixed(1)}px Inter, sans-serif`;

              const textX = targetProj.x + 7;
              const textY = targetProj.y + 3.5;
              const textW = ctx.measureText(displayLabel).width;
              const box = {
                left: textX - 3,
                right: textX + textW + 3,
                top: textY - fontSize + 1,
                bottom: textY + 4
              };

              const overlapsExisting = placedLabelBoxes.some(
                (b) =>
                  box.left < b.right &&
                  box.right > b.left &&
                  box.top < b.bottom &&
                  box.bottom > b.top
              );

              if (isSelected || !overlapsExisting) {
                placedLabelBoxes.push(box);

                ctx.fillStyle = isSelected
                  ? `rgba(9, 17, 31, ${(0.94 * alpha).toFixed(3)})`
                  : `rgba(7, 14, 26, ${(0.82 * alpha).toFixed(3)})`;
                ctx.strokeStyle = isSelected
                  ? `rgba(250, 204, 21, ${(0.9 * alpha).toFixed(3)})`
                  : `rgba(148, 163, 184, ${(0.34 * alpha).toFixed(3)})`;
                ctx.lineWidth = 0.85;
                roundRectPath(
                  ctx,
                  box.left,
                  box.top,
                  box.right - box.left,
                  box.bottom - box.top,
                  4
                );
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isSelected
                  ? `rgba(254, 249, 195, ${(1 * alpha).toFixed(3)})`
                  : `rgba(248, 250, 252, ${(0.98 * alpha).toFixed(3)})`;
                ctx.fillText(displayLabel, textX, textY);
              }
            }
            ctx.restore();
          }
        }
      }

      function renderSpotsListUI() {
        const countStr = String(RECEPTION_SPOTS.length);
        if (spotsCountEl) spotsCountEl.textContent = countStr;
        if (topSpotsCountEl) topSpotsCountEl.textContent = countStr;
        spotsCountMirrors.forEach((el) => {
          el.textContent = countStr;
        });

        const containers = [spotsListEl, spotsListMobileEl].filter(Boolean);
        if (containers.length === 0) return;

        for (const container of containers) {
          container.innerHTML = '';

          for (const spot of RECEPTION_SPOTS) {
            const isSelected = state.selectedSpotId === spot.id;
            const displayLabel = spot.regionLabel || spot.name;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `spot-chip text-[11px] px-2 py-1 rounded-lg border font-medium flex items-center gap-1.5 ${
              isSelected
                ? 'bg-emerald-500/25 border-emerald-400 text-emerald-200'
                : 'bg-slate-800/75 border-slate-700/80 text-slate-200 hover:border-sky-400/50 hover:text-sky-200'
            }`;
            btn.title = `${displayLabel} (${spot.category}) — ${spot.note}`;
            btn.innerHTML = `
              <span class="h-1.5 w-1.5 rounded-full shrink-0 ${spot.category === 'État US' ? 'bg-sky-400' : 'bg-emerald-400'}"></span>
              <span>${displayLabel}</span>
              <span class="text-[9.5px] text-slate-400">${spot.category}</span>
            `;

            btn.addEventListener('click', () => {
              if (state.selectedSpotId === spot.id) {
                state.selectedSpotId = null;
                clearSpotFocusBtns.forEach((b) => b.classList.add('hidden'));
                renderSpotsListUI();
                showToast('Affichage de tous les arcs de réception');
                return;
              }
              state.selectedSpotId = spot.id;
              clearSpotFocusBtns.forEach((b) => b.classList.remove('hidden'));
              renderSpotsListUI();
              const target = getTargetAnglesForBeacon(spot.lat, spot.lon);
              state.targetRotY = target.rotY;
              state.targetRotX = target.rotX;
              state.isRecentering = true;
              state.velY = 0;
              state.velX = 0;
              showToast(`${displayLabel} (${spot.category}) · ${spot.note}`);
            });

            container.appendChild(btn);
          }
        }
      }

      function projectUnitVec3(x, y, z, radius, center, altMult = 1) {
        const r = radius * altMult;
        const px = x * r;
        const py = y * r;
        const pz = z * r;

        const cosY = Math.cos(state.rotY + state.smoothPointerX * 0.06);
        const sinY = Math.sin(state.rotY + state.smoothPointerX * 0.06);
        const x1 = px * cosY + pz * sinY;
        const z1 = -px * sinY + pz * cosY;

        const pitch = Math.max(-1.35, Math.min(1.35, state.rotX + state.smoothPointerY * 0.05));
        const cosX = Math.cos(pitch);
        const sinX = Math.sin(pitch);
        const y2 = py * cosX - z1 * sinX;
        const z2 = py * sinX + z1 * cosX;

        return {
          x: center.cx + x1,
          y: center.cy + y2,
          z: z2
        };
      }

      function drawBeaconAndMarkers(radius, center, time) {
        // Secondary regional / reference markers
        for (let i = 1; i < GEO_MARKERS.length; i++) {
          const m = GEO_MARKERS[i];
          const p = projectLatLon(m.lat, m.lon, radius, center, 1.002);
          if (p.z > 4) {
            const fade = Math.min(1, p.z / (radius * 0.35));
            const isRegional = Boolean(m.regional);
            const isReliefPeak = m.feature === 'peak' || m.feature === 'relief';
            if (isRegional && state.zoom < 1.12) continue;
            if (isReliefPeak && state.zoom < 1.28) continue;

            ctx.beginPath();
            ctx.arc(p.x, p.y, isReliefPeak ? 2.4 : isRegional ? 2.1 : 2.6, 0, Math.PI * 2);
            ctx.fillStyle = isReliefPeak
              ? `rgba(253, 230, 138, ${(0.9 * fade).toFixed(3)})`
              : isRegional
                ? `rgba(167, 243, 208, ${(0.86 * fade).toFixed(3)})`
                : `rgba(186, 230, 253, ${(0.80 * fade).toFixed(3)})`;
            ctx.fill();

            if (state.zoom > 1.25 || (!isRegional && i <= 12) || (isRegional && state.zoom >= 1.32)) {
              ctx.font = isReliefPeak
                ? '500 9.5px "JetBrains Mono", monospace'
                : isRegional
                  ? '500 10px Inter, sans-serif'
                  : '500 10.5px Inter, sans-serif';
              ctx.fillStyle = isReliefPeak
                ? `rgba(254, 240, 138, ${(0.9 * fade).toFixed(3)})`
                : isRegional
                  ? `rgba(209, 250, 229, ${(0.9 * fade).toFixed(3)})`
                  : `rgba(226, 232, 240, ${(0.84 * fade).toFixed(3)})`;
              ctx.fillText(m.label, p.x + 6, p.y + 3);
            }
          }
        }

        // Primary FK5ZDC beacon at Mont Do, Boulouparis
        const beaconProj = projectLatLon(BEACON.lat, BEACON.lon, radius, center, 1.004);
        if (beaconProj.z > -radius * 0.05) {
          const frontVisibility = Math.max(0, Math.min(1, (beaconProj.z + radius * 0.05) / (radius * 0.25)));

          // Expanding radio propagation wave rings (10m band feel)
          const numRings = 4;
          const cycleDuration = 4.2; // seconds per full wave expansion
          const maxAngleDeg = 46; // spherical angular radius of propagation ring

          for (let rIdx = 0; rIdx < numRings; rIdx++) {
            const phase = ((time * 0.001 / cycleDuration) + rIdx / numRings) % 1;
            const angleDeg = 2.5 + phase * maxAngleDeg;
            const alpha = (1 - phase) * 0.72 * frontVisibility;
            if (alpha > 0.02) {
              const strokeColor = rIdx % 2 === 0
                ? `rgba(52, 211, 153, ${alpha.toFixed(3)})`
                : `rgba(56, 189, 248, ${(alpha * 0.85).toFixed(3)})`;
              drawSphericalWaveRing(
                BEACON.lat,
                BEACON.lon,
                angleDeg,
                radius,
                center,
                strokeColor,
                rIdx === 0 ? 1.8 : 1.35
              );
            }
          }

          // Soft halo around Mont Do beacon
          const haloRadius = 14 + Math.sin(time * 0.005) * 3;
          const haloGrad = ctx.createRadialGradient(
            beaconProj.x,
            beaconProj.y,
            1,
            beaconProj.x,
            beaconProj.y,
            haloRadius
          );
          haloGrad.addColorStop(0, `rgba(110, 231, 183, ${(0.95 * frontVisibility).toFixed(3)})`);
          haloGrad.addColorStop(0.45, `rgba(16, 185, 129, ${(0.45 * frontVisibility).toFixed(3)})`);
          haloGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');

          ctx.beginPath();
          ctx.arc(beaconProj.x, beaconProj.y, haloRadius, 0, Math.PI * 2);
          ctx.fillStyle = haloGrad;
          ctx.fill();

          // Core beacon pin dot
          ctx.beginPath();
          ctx.arc(beaconProj.x, beaconProj.y, 4.2, 0, Math.PI * 2);
          ctx.fillStyle = '#ecfdf5';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#10b981';
          ctx.stroke();

          // Callout tag right beside Mont Do if visible on front hemisphere
          if (beaconProj.z > 8) {
            const labelAlpha = Math.min(1, (beaconProj.z - 8) / (radius * 0.25));
            const tagX = beaconProj.x + 12;
            const tagY = beaconProj.y - 14;

            ctx.save();
            ctx.globalAlpha = labelAlpha;
            ctx.font = '600 12px "JetBrains Mono", monospace';
            const titleText = 'FK5ZDC · Mont Do';
            const subText = 'RG38AF · 28,2075 MHz';
            const boxW = Math.max(ctx.measureText(titleText).width, 134) + 18;
            const boxH = 36;

            // Leader line
            ctx.beginPath();
            ctx.moveTo(beaconProj.x + 4, beaconProj.y - 3);
            ctx.lineTo(tagX, tagY + boxH * 0.5);
            ctx.strokeStyle = 'rgba(110, 231, 183, 0.75)';
            ctx.lineWidth = 1.25;
            ctx.stroke();

            // Tag pill
            ctx.fillStyle = 'rgba(9, 17, 31, 0.86)';
            ctx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
            ctx.lineWidth = 1;
            roundRectPath(ctx, tagX, tagY, boxW, boxH, 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#6ee7b7';
            ctx.fillText(titleText, tagX + 9, tagY + 14);

            ctx.font = '500 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(subText, tagX + 9, tagY + 28);
            ctx.restore();
          }
        }
      }

      function roundRectPath(context, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      // =========================================================================
      // 5. ANIMATION LOOP & INTERACTION HANDLERS
      // =========================================================================
      let lastFrameTime = performance.now();

      function updatePhysics(dtSec) {
        // Smooth pointer parallax interpolation
        state.smoothPointerX += (state.pointerNormX - state.smoothPointerX) * Math.min(1, dtSec * 6);
        state.smoothPointerY += (state.pointerNormY - state.smoothPointerY) * Math.min(1, dtSec * 6);

        // Smooth zoom interpolation
        state.zoom += (state.targetZoom - state.zoom) * Math.min(1, dtSec * 9);

        if (state.isRecentering && !state.isDragging) {
          // Smoothly interpolate rotation toward FK5ZDC at Mont Do
          const lerpAlpha = Math.min(1, dtSec * 6.5);
          state.rotY += (state.targetRotY - state.rotY) * lerpAlpha;
          state.rotX += (state.targetRotX - state.rotX) * lerpAlpha;

          if (
            Math.abs(state.targetRotY - state.rotY) < 0.0008 &&
            Math.abs(state.targetRotX - state.rotX) < 0.0008
          ) {
            state.rotY = state.targetRotY;
            state.rotX = state.targetRotX;
            state.isRecentering = false;
          }
        } else if (!state.isDragging) {
          // Apply drag inertia with smooth damping
          state.rotY += state.velY;
          state.rotX += state.velX;
          state.velY *= Math.pow(0.06, dtSec);
          state.velX *= Math.pow(0.06, dtSec);

          // Gentle breathing oscillation around current orientation when idle
          if (state.autoDrift) {
            state.rotY += Math.sin(state.time * 0.0007) * 0.00032;
          }
        }

        // Clamp latitude tilt to avoid flipping over the poles
        const maxPitch = 1.25;
        if (state.rotX > maxPitch) {
          state.rotX = maxPitch;
          state.velX = 0;
        } else if (state.rotX < -maxPitch) {
          state.rotX = -maxPitch;
          state.velX = 0;
        }
      }

      function render(now) {
        const dtMs = Math.min(50, Math.max(1, now - lastFrameTime));
        lastFrameTime = now;
        state.time += dtMs;

        updatePhysics(dtMs / 1000);

        ctx.clearRect(0, 0, state.width, state.height);
        drawStars(state.time);

        const radius = getGlobeRadius();
        const center = getGlobeCenter();

        drawAtmosphereAndSphere(radius, center);
        drawReceptionArcsAndSpots(radius, center, state.time);
        drawBeaconAndMarkers(radius, center, state.time);

        requestAnimationFrame(render);
      }

      // Mouse drag rotation
      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        state.isDragging = true;
        state.isRecentering = false;
        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
        state.velY = 0;
        state.velX = 0;
      });

      window.addEventListener('mousemove', (e) => {
        // Update subtle cursor-following parallax
        const rect = wrapper.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          state.pointerNormX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          state.pointerNormY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
        }

        if (!state.isDragging) return;
        const dx = e.clientX - state.lastPointerX;
        const dy = e.clientY - state.lastPointerY;
        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;

        const sensitivity = 0.0062 / Math.sqrt(state.zoom);
        state.rotY += dx * sensitivity;
        state.rotX += dy * sensitivity;
        state.velY = dx * sensitivity * 0.45;
        state.velX = dy * sensitivity * 0.45;
      });

      window.addEventListener('mouseup', () => {
        state.isDragging = false;
      });

      wrapper.addEventListener('mouseleave', () => {
        state.pointerNormX = 0;
        state.pointerNormY = 0;
      });

      // Touch drag & pinch-to-zoom support
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          state.isDragging = true;
          state.isRecentering = false;
          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
          state.velY = 0;
          state.velX = 0;
        } else if (e.touches.length === 2) {
          state.isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          state.pinchStartDist = Math.hypot(dx, dy);
          state.pinchStartZoom = state.targetZoom;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && state.isDragging) {
          const touch = e.touches[0];
          const dx = touch.clientX - state.lastPointerX;
          const dy = touch.clientY - state.lastPointerY;
          state.lastPointerX = touch.clientX;
          state.lastPointerY = touch.clientY;

          const sensitivity = 0.0065 / Math.sqrt(state.zoom);
          state.rotY += dx * sensitivity;
          state.rotX += dy * sensitivity;
          state.velY = dx * sensitivity * 0.45;
          state.velX = dy * sensitivity * 0.45;
        } else if (e.touches.length === 2 && state.pinchStartDist) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const nextZoom = state.pinchStartZoom * (dist / state.pinchStartDist);
          state.targetZoom = Math.max(state.minZoom, Math.min(state.maxZoom, nextZoom));
        }
      }, { passive: false });

      canvas.addEventListener('touchend', () => {
        state.isDragging = false;
        state.pinchStartDist = null;
      });

      // Mouse wheel zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
        state.targetZoom = Math.max(state.minZoom, Math.min(state.maxZoom, state.targetZoom * zoomFactor));
      }, { passive: false });

      // Toolbar controls
      toggleBtn.addEventListener('click', () => {
        const isNowHidden = infoCard.classList.toggle('hidden');
        toggleBtn.setAttribute('aria-expanded', String(!isNowHidden));
        toggleLabel.textContent = isNowHidden ? 'Infos' : 'Fermer';
      });

      if (toggleSpotsBtn && spotsCard) {
        toggleSpotsBtn.addEventListener('click', () => {
          const isSpotsHidden = spotsCard.classList.toggle('hidden');
          toggleSpotsBtn.setAttribute('aria-expanded', String(!isSpotsHidden));
          showToast(isSpotsHidden ? 'Liste des écoutes masquée' : 'Liste des écoutes affichée');
        });
      }

      zoomInBtn.addEventListener('click', () => {
        state.isRecentering = false;
        state.targetZoom = Math.min(state.maxZoom, state.targetZoom * 1.22);
      });

      zoomOutBtn.addEventListener('click', () => {
        state.isRecentering = false;
        state.targetZoom = Math.max(state.minZoom, state.targetZoom * 0.82);
      });

      centerBtn.addEventListener('click', () => {
        const target = getTargetAnglesForBeacon(BEACON.lat, BEACON.lon);
        state.targetRotY = target.rotY;
        state.targetRotX = target.rotX;
        state.targetZoom = 1.15;
        state.isRecentering = true;
        state.velY = 0;
        state.velX = 0;
        showToast('Recentré sur FK5ZDC · Mont Do (RG38AF)');
      });

      toggleArcsBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          state.showArcs = !state.showArcs;
          toggleArcsBtns.forEach((b) => {
            b.textContent = state.showArcs ? 'Arcs actifs' : 'Arcs masqués';
          });
          showToast(state.showArcs ? 'Arcs de réception affichés' : 'Arcs de réception masqués');
        });
      });

      clearSpotFocusBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedSpotId = null;
          clearSpotFocusBtns.forEach((b) => b.classList.add('hidden'));
          renderSpotsListUI();
          showToast('Tous les arcs de réception affichés');
        });
      });

      window.addEventListener('resize', resizeCanvas);

      // Initialize and start loop
      resizeCanvas();
      renderSpotsListUI();
      upgradeCoastlineResolution();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
